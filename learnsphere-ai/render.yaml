# Optional Render Blueprint: Render -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: learnsphere-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false        # you type the value in the Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
